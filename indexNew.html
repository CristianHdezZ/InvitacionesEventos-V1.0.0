<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Invitación XV</title>

    <!-- El HEAD NO puede cargarse con fetch -->
    <!-- Copia aquí el contenido completo de head.html -->

</head>

<body>

    <div id="gate"></div>

    <div id="hero"></div>

    <div id="countdown"></div>

    <main id="main">

        <div id="letter"></div>

        <div id="timeline"></div>

        <div id="dresscode"></div>

        <div id="gifts"></div>

        <div id="location"></div>

        <div id="gallery"></div>

        <div id="playlist"></div>

        <div id="rsvp"></div>

    </main>

    <div id="footer"></div>

    <div id="scripts"></div>

    <script>

        const partials = [

            {
                id: "gate",
                file: "html/partials/gate.html"
            },

            {
                id: "hero",
                file: "html/partials/hero.html"
            },

            {
                id: "countdown",
                file: "html/partials/countdown.html"
            },

            {
                id: "letter",
                file: "html/partials/letter.html"
            },

            {
                id: "timeline",
                file: "html/partials/timeline.html"
            },

            {
                id: "dresscode",
                file: "html/partials/dresscode.html"
            },

            {
                id: "gifts",
                file: "html/partials/gifts.html"
            },

            {
                id: "location",
                file: "html/partials/location.html"
            },

            {
                id: "gallery",
                file: "html/partials/gallery.html"
            },

            {
                id: "playlist",
                file: "html/partials/playlist.html"
            },

            {
                id: "rsvp",
                file: "html/partials/rsvp.html"
            },

            {
                id: "footer",
                file: "html/partials/footer.html"
            },

            {
                id: "scripts",
                file: "html/partials/scripts.html"
            }

        ];

        async function loadPartials() {

            for (const partial of partials) {

                const response = await fetch(partial.file);

                if (!response.ok) {

                    console.error("No se encontró:", partial.file);

                    continue;

                }

                document.getElementById(partial.id).innerHTML =
                    await response.text();

            }

        }

        loadPartials();

    </script>

</body>

</html>
