<!-- ===================== BIENVENIDA / FOTO ===================== -->
<header id="hero" class="hero">
  <p class="hero__eyebrow" data-aos="fade-down">Tenemos el honor de invitarlos a la celebración de los XV años de nuestra hija</p>

  <div class="hero__frame" data-aos="zoom-in" data-aos-delay="100">
    <img id="fotoPrincipal" src="assets/gallery/image01.jpeg" alt="Retrato de Linda Hernández">
  </div>

  <svg class="name-crown" id="heroCoronaSvg" viewBox="0 0 100 60" aria-hidden="true" style="display:none" data-aos="fade-down" data-aos-delay="150">
    <path d="M10,50 L10,30 L25,42 L35,15 L50,35 L65,15 L75,42 L90,30 L90,50 Z" fill="none" stroke="var(--oro)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="35" cy="15" r="4" fill="var(--oro)"/>
    <circle cx="50" cy="10" r="5" fill="var(--rosa-deep)"/>
    <circle cx="65" cy="15" r="4" fill="var(--oro)"/>
    <line x1="15" y1="50" x2="85" y2="50" stroke="var(--oro)" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <img class="name-crown name-crown-img" id="heroCoronaImg" src="" alt="" hidden data-aos="fade-down" data-aos-delay="150">
  <h1 class="hero__name" data-aos="fade-up" data-aos-delay="200">Linda</h1>
  <p class="hero__apellido" data-aos="fade-up" data-aos-delay="250">Hernández</p>
  <p class="hero__subtitle" data-aos="fade-up" data-aos-delay="300">Que se llevará a cabo el día</p>

  <div class="hero__badge" data-aos="zoom-in" data-aos-delay="350">
    <span>Sábado</span>
    <strong>19</strong>
    <span>Septiembre</span>
    <span class="hero__badge-burst" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </span>
  </div>
  <p class="hero__year" data-aos="fade-up" data-aos-delay="400">2026</p>
</header>
